services:
  google-maps-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-maps-mcp-server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HTTP_PROTOCOL: ${MCP_HTTP_PROTOCOL:-STREAMABLE}
      MAP_PROVIDER: ${MAP_PROVIDER:-openstreetmap}
      MAP_FALLBACK_ENABLED: ${MAP_FALLBACK_ENABLED:-true}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      GRAPHHOPPER_API_KEY: ${GRAPHHOPPER_API_KEY:-}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
